{% extends "index.html" %}

{% block report_block %}
<div class="managmentBox">
    <h1>{{title}}</h1>
    <div class="formBox">
        <form class="managmentForm" method="POST">
            {% csrf_token %}
            {%for message in messages%}
            <p>{{message}}</p>
            {%endfor%}
            {{form.as_div}}
            <button type="submit" name="submit">Submit</button>
        </form>
    </div>
</div>
{% endblock %}
